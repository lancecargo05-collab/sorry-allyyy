<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Baby ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffb6c1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Main card */
        .card {
            width: 90%;
            max-width: 900px;
            padding: 60px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 35px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            z-index: 5;
            animation: appear 1.5s ease;
        }

        .small-heart {
            font-size: 45px;
            animation: heartbeat 1.2s infinite;
        }

        h1 {
            margin-top: 15px;
            font-size: clamp(45px, 8vw, 100px);
            font-weight: 900;
            line-height: 0.95;
            color: white;
            text-shadow:
                0 5px 0 #ff4f70,
                0 0 20px rgba(255,255,255,0.8),
                0 0 40px rgba(255,80,120,0.8);
            animation: pulse 2s infinite;
        }

        .message {
            margin-top: 30px;
            font-size: 24px;
            color: white;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;
            border-radius: 50px;
            background: white;
            color: #ff4f70;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
            cursor: pointer;
        }

        .button:hover {
            transform: scale(1.1);
            background: #fff0f4;
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            bottom: -50px;
            color: white;
            font-size: 25px;
            animation: floatUp linear infinite;
            opacity: 0.8;
            z-index: 1;
        }

        .heart:nth-child(1) {
            left: 5%;
            animation-duration: 7s;
            font-size: 35px;
        }

        .heart:nth-child(2) {
            left: 15%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .heart:nth-child(3) {
            left: 25%;
            animation-duration: 6s;
            animation-delay: 1s;
            font-size: 45px;
        }

        .heart:nth-child(4) {
            left: 40%;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        .heart:nth-child(5) {
            left: 55%;
            animation-duration: 7s;
            animation-delay: 1s;
            font-size: 40px;
        }

        .heart:nth-child(6) {
            left: 70%;
            animation-duration: 8s;
            animation-delay: 4s;
        }

        .heart:nth-child(7) {
            left: 82%;
            animation-duration: 6s;
            animation-delay: 2s;
            font-size: 50px;
        }

        .heart:nth-child(8) {
            left: 93%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.9;
            }

            100% {
                transform: translateY(-120vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            color: white;
            font-size: 20px;
            animation: sparkle 2s infinite;
        }

        .s1 { top: 10%; left: 10%; }
        .s2 { top: 20%; right: 15%; animation-delay: .5s; }
        .s3 { bottom: 15%; left: 20%; animation-delay: 1s; }
        .s4 { bottom: 20%; right: 20%; animation-delay: 1.5s; }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0.5);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }
    </style>
</head>

<body>

    <!-- Floating Hearts -->
    <div class="heart">❤️</div>
    <div class="heart">💗</div>
    <div class="heart">💕</div>
    <div class="heart">❤️</div>
    <div class="heart">💖</div>
    <div class="heart">💗</div>
    <div class="heart">💕</div>
    <div class="heart">❤️</div>

    <!-- Sparkles -->
    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✧</div>

    <!-- Main Message -->
    <div class="card">

        <div class="small-heart">❤️</div>

        <h1>
            SORRY NA<br>
            BATI NA TAYO
        </h1>

        <p class="message">
            🥺👉👈 Peace na tayo, baby?
        </p>

        <div class="button" onclick="forgiveMe()">
            CLICK ME ❤️
        </div>

    </div>

    <script>
        function forgiveMe() {
            alert("I’m really sorry, baby. 🥺❤️ Bati na tayo please?");
        }
    </script>

</body>
</html>
